<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Secure Vault...</title>
    <script type="text/javascript">
      // Single Page App fallback for GitHub Pages
      // If a route or refreshed path is requested, redirect to index.html with route preserved
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var restOfPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?p=' + encodeURIComponent(restOfPath) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      
      l.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #09090b; color: #a1a1aa; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #f4f4f5; font-size: 1.25rem; margin-bottom: 0.5rem;">Loading Secure Vault...</h2>
      <p style="font-size: 0.875rem;">Redirecting to the main application.</p>
    </div>
  </body>
</html>
